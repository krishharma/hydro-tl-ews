name: midwest_mini_walk_forward
stage: walk_forward
seed: 42

data:
  source: camels
  camels_root: data
  target_basin: "05507600"
  full_period: ["1990-01-01", "2014-12-31"]
  sequence_length: 90

model:
  pretrained_checkpoint: results/midwest_mini/checkpoints/finetune_conservative.pt
  hidden_size: 128
  dropout: 0.4

walk_forward:
  initial_train_end: "2010-12-31"
  eval_end: "2014-12-31"
  refit_every_days: 90
  online_bias_correction: true
  val_tail_days: 90
  refit_train_start: "2009-01-01"
  fine_tune:
    head_lr: 1.0e-3
    lstm_lr: 1.0e-5
    epochs_head_only: 2
    epochs_progressive: 0
    patience: 2
    unfreeze_fraction: 0.0

evaluation:
  lead_times: [1, 3, 7]
  threshold_specs:
    - { kind: flood, percentile: q95 }
    - { kind: flood, percentile: q99 }
    - { kind: drought, percentile: q5 }
  metrics: [NSE, KGE, PBIAS, AUC, F1, Brier]

xai:
  enabled: true
  background_size: 200
  sample_size: 100
  seasonal_breakdown: true

output:
  results_path: results/midwest_mini/walk_forward.csv
  warnings_path: results/midwest_mini/walk_forward_warnings.csv
  metrics_path: results/midwest_mini/walk_forward_metrics.json
  shap_importance_path: results/midwest_mini/shap_global_importance.csv
