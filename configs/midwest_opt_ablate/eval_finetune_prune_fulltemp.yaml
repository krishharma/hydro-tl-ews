name: midwest_ablate_prune_fulltemp_eval_finetune
stage: zero_shot
seed: 42

data:
  source: camels
  camels_root: data
  target_basin: "05507600"
  dynamic_feature_set: full
  full_period: ["2011-01-01", "2014-12-31"]
  normalization_period: ["2009-01-01", "2010-12-31"]
  sequence_length: 90

model:
  pretrained_checkpoint: results/midwest_opt_ablate/prune_fulltemp/checkpoints/finetune_conservative.pt

training:
  batch_size: 128

output:
  metrics_path: results/midwest_opt_ablate/prune_fulltemp/finetune_eval_metrics.json
  predictions_path: results/midwest_opt_ablate/prune_fulltemp/finetune_eval_predictions.csv
