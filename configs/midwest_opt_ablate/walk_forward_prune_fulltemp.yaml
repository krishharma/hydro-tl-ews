name: midwest_ablate_prune_fulltemp_walk_forward
stage: walk_forward
seed: 42

data:
  source: camels
  camels_root: data
  target_basin: "05507600"
  dynamic_feature_set: full
  full_period: ["1990-01-01", "2014-12-31"]
  sequence_length: 90

model:
  pretrained_checkpoint: results/midwest_opt_ablate/prune_fulltemp/checkpoints/finetune_conservative.pt
  hidden_size: 128
  dropout: 0.4
  initial_forget_bias: 3.0

walk_forward:
  initial_train_end: "2010-12-31"
  eval_end: "2014-12-31"
  refit_every_days: 90
  online_bias_correction: true
  val_tail_days: 90
  refit_train_start: "2009-01-01"
  fine_tune:
    head_lr: 1.0e-3
    lstm_lr: 1.0e-5
    epochs_head_only: 2
    epochs_progressive: 0
    patience: 2
    unfreeze_fraction: 0.0

evaluation:
  lead_times: [1, 3, 7]
  threshold_specs:
    - { kind: flood, percentile: q95 }
    - { kind: flood, percentile: q99 }
    - { kind: drought, percentile: q5 }
  metrics: [NSE, KGE, PBIAS, AUC, F1, Brier]

xai:
  enabled: false

output:
  results_path: results/midwest_opt_ablate/prune_fulltemp/walk_forward.csv
  warnings_path: results/midwest_opt_ablate/prune_fulltemp/walk_forward_warnings.csv
  metrics_path: results/midwest_opt_ablate/prune_fulltemp/walk_forward_metrics.json
