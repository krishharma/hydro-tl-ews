name: midwest_ablate_prune_fulltemp_finetune
stage: finetune_conservative
seed: 42

data:
  source: camels
  camels_root: data
  target_basin: "05507600"
  dynamic_feature_set: full
  warmup_period: ["2009-01-01", "2010-08-31"]
  validation_period: ["2009-09-02", "2010-12-31"]
  sequence_length: 90

model:
  pretrained_checkpoint: results/midwest_opt_ablate/prune_fulltemp/checkpoints/pretrain.pt
  hidden_size: 128
  dropout: 0.4
  initial_forget_bias: 3.0

training:
  batch_size: 64
  epochs: 8
  patience: 3
  head_lr: 1.0e-3
  weight_decay: 0.0

output:
  checkpoint_path: results/midwest_opt_ablate/prune_fulltemp/checkpoints/finetune_conservative.pt
  history_path: results/midwest_opt_ablate/prune_fulltemp/history/finetune_conservative.json
