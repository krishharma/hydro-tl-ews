name: midwest_opt_zero_shot
stage: zero_shot
seed: 42

data:
  source: camels
  camels_root: data
  target_basin: "05507600"
  dynamic_feature_set: mean_temp
  full_period: ["2011-01-01", "2014-12-31"]
  normalization_period: ["2009-01-01", "2010-12-31"]
  sequence_length: 90

model:
  pretrained_checkpoint: results/midwest_opt/seed_42/checkpoints/pretrain.pt

training:
  batch_size: 128

output:
  metrics_path: results/midwest_opt/seed_42/zero_shot_metrics.json
  predictions_path: results/midwest_opt/seed_42/zero_shot_predictions.csv
